<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro — DossiêDoc</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="site-header-bar">
  <a href="/" class="logo">dossiê<span class="doc">doc</span></a>
  <a href="/" class="home-link">Página inicial</a>
</div>
<div class="wrap">

  <header>
    <div class="kicker">Dossiê de Documentos</div>
    <h1>Crie sua conta</h1>
    <p class="sub">Cadastra nome, e-mail e senha. Você já cai na sua área de conta, com 8 documentos grátis pra testar antes de decidir.</p>
  </header>

  <div class="card" id="formCard">
    <label class="field-label" for="lawyerName">Seu nome completo</label>
    <input type="text" id="lawyerName" placeholder="Ex: Ana Barletta">
    <label class="field-label" for="lawyerEmail" style="margin-top:14px">Seu e-mail</label>
    <input type="email" id="lawyerEmail" placeholder="voce@email.com">
    <label class="field-label" for="lawyerEmailConfirm" style="margin-top:14px">Confirme seu e-mail</label>
    <input type="email" id="lawyerEmailConfirm" placeholder="voce@email.com" autocomplete="off">
    <label class="field-label" for="lawyerPassword" style="margin-top:14px">Crie uma senha</label>
    <input type="password" id="lawyerPassword" placeholder="Mínimo 6 caracteres">
    <label class="field-label" for="lawyerPasswordConfirm" style="margin-top:14px">Confirme a senha</label>
    <input type="password" id="lawyerPasswordConfirm" placeholder="Repita a senha">
    <label style="display:flex; align-items:flex-start; gap:8px; margin-top:16px; font-size:13px; color:var(--ink-soft); cursor:pointer;">
      <input type="checkbox" id="acceptTerms" style="margin-top:3px;">
      <span>Li e aceito os <a href="/termos.html" target="_blank">Termos de Uso e a Política de Privacidade</a>, e sou responsável por obter o consentimento dos meus próprios clientes antes de solicitar documentos por este meio.</span>
    </label>
    <div id="errorArea"></div>
    <button class="primary" id="registerBtn">Criar conta e testar grátis</button>
    <p class="note">Já tem conta? <a href="/login.html">Entrar</a></p>
  </div>

</div>

<script>
const registerBtn = document.getElementById('registerBtn');
const errorArea = document.getElementById('errorArea');

registerBtn.addEventListener('click', register);
document.getElementById('formCard').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    register();
  }
});

async function register() {
  const name = document.getElementById('lawyerName').value.trim();
  const email = document.getElementById('lawyerEmail').value.trim();
  const emailConfirm = document.getElementById('lawyerEmailConfirm').value.trim();
  const password = document.getElementById('lawyerPassword').value;
  const passwordConfirm = document.getElementById('lawyerPasswordConfirm').value;
  const acceptedTerms = document.getElementById('acceptTerms').checked;
  errorArea.innerHTML = '';

  if (!name || !email || !emailConfirm || !password || !passwordConfirm) {
    errorArea.innerHTML = '<div class="error-banner">Preenche todos os campos antes de continuar.</div>';
    return;
  }
  if (!acceptedTerms) {
    errorArea.innerHTML = '<div class="error-banner">Precisa aceitar os Termos de Uso e a Política de Privacidade pra continuar.</div>';
    return;
  }
  if (email.toLowerCase() !== emailConfirm.toLowerCase()) {
    errorArea.innerHTML = '<div class="error-banner">Os dois e-mails digitados são diferentes. Confere e tenta de novo.</div>';
    return;
  }
  if (password.length < 6) {
    errorArea.innerHTML = '<div class="error-banner">A senha precisa ter pelo menos 6 caracteres.</div>';
    return;
  }
  if (password !== passwordConfirm) {
    errorArea.innerHTML = '<div class="error-banner">As duas senhas digitadas são diferentes. Confere e tenta de novo.</div>';
    return;
  }

  registerBtn.disabled = true;
  registerBtn.textContent = 'Criando…';

  try {
    const response = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, acceptedTerms })
    });
    if (response.status === 409) {
      errorArea.innerHTML = '<div class="error-banner">Esse e-mail já tem conta. <a href="/login.html">Faz login</a> em vez disso.</div>';
      registerBtn.disabled = false;
      registerBtn.textContent = 'Criar conta e testar grátis';
      return;
    }
    if (!response.ok) throw new Error('Falha no cadastro');
    const data = await response.json();

    // já leva direto pra tela de teste, usando o próprio token do advogado
    localStorage.setItem('dossiedoc_token', data.token);
    window.location.href = '/conta.html?token=' + encodeURIComponent(data.token);
  } catch (err) {
    console.error('register error', err);
    errorArea.innerHTML = '<div class="error-banner">Não deu pra criar sua conta agora. Tenta de novo em instantes.</div>';
    registerBtn.disabled = false;
    registerBtn.textContent = 'Criar conta e testar grátis';
  }
}
</script>
</body>
</html>
